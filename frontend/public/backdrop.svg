<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Page background: graphite with a faint warm light from the top-left and fine grain. -->
  <defs>
    <radialGradient id="glow" cx="18%" cy="8%" r="70%">
      <stop offset="0" stop-color="#3a2a16" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#1a1712" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0b0c0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#0c0d10"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" filter="url(#grain)"/>
</svg>
